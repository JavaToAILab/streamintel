# StreamIntel + single-node Kafka, with built-in demo traffic.
# Inject an incident:  curl -X POST localhost:8080/demo/incident
# Optional LLM summaries: set STREAMINTEL_LLM_ENABLED=true and point STREAMINTEL_LLM_BASE_URL at an
# OpenAI-compatible endpoint (Ollama on the host works: http://host.docker.internal:11434).
services:
  streamintel:
    build: .
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STREAMINTEL_DEMO: "true"
      STREAMINTEL_LLM_ENABLED: ${STREAMINTEL_LLM_ENABLED:-false}
      STREAMINTEL_LLM_BASE_URL: ${STREAMINTEL_LLM_BASE_URL:-http://host.docker.internal:11434}
      STREAMINTEL_WEBHOOK_URL: ${STREAMINTEL_WEBHOOK_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kafka

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
